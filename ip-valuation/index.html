<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="명밸류 파트너스 IP 담보평가 실무 작업공간" />
    <link rel="icon" href="./assets/images/favicon.svg" />
    <title>IP 담보평가 포트폴리오</title>
    <link rel="stylesheet" href="./assets/css/app.css" />
    <link rel="stylesheet" href="../valuation/valuation-auth.css" />
    <link rel="stylesheet" href="./assets/css/overrides.css" />
  </head>
  <body class="ip-valuation-app auth-locked">
    <div id="ipAgencyGate" class="agency-gate" aria-hidden="false">
      <section class="agency-login-card" aria-labelledby="ipAgencyLoginTitle">
        <div class="agency-login-head">
          <img src="../assets/logo.png" alt="명밸류 파트너스" />
          <div><strong>IP 가치평가 플랫폼</strong><span>AUTHORIZED ACCESS</span></div>
        </div>
        <h2 id="ipAgencyLoginTitle">기관코드 입력</h2>
        <p class="agency-login-desc">발급받은 기관코드를 입력한 뒤 기관 암호를 입력해 주세요.</p>

        <label class="agency-code-label" for="ipAgencyCode">기관코드</label>
        <div class="agency-code-wrap">
          <input id="ipAgencyCode" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="기관코드 입력" />
          <button id="ipAgencyCodeBtn" class="agency-code-submit" type="button">확인</button>
        </div>
        <div id="ipAgencyCodeStatus" class="agency-code-status" aria-live="polite"></div>

        <div id="ipAgencyAuthPanel" class="agency-auth-panel" hidden>
          <div id="ipAgencyPreview" class="agency-preview-card" aria-live="polite">
            <img id="ipAgencyPreviewLogo" src="../assets/logo.png" alt="" />
            <div>
              <strong id="ipAgencyPreviewName"></strong>
              <small id="ipAgencyPreviewSubline"></small>
            </div>
          </div>

          <label class="agency-password-label" for="ipAgencyPassword">기관 암호</label>
          <div class="agency-password-wrap">
            <input id="ipAgencyPassword" type="password" autocomplete="current-password" placeholder="암호 입력" />
            <button id="ipAgencyEnterBtn" class="agency-enter" type="button">입장</button>
          </div>
          <div id="ipAgencyLoginStatus" class="agency-login-status" aria-live="polite"></div>
        </div>
        <a class="agency-home-link" href="../">홈페이지로 돌아가기</a>
        <p class="agency-login-note">※ 현재 단계의 암호 기능은 시연·내부 사용을 위한 간편 진입 제한 방식입니다.</p>
        <p class="agency-support-contact">접속장애 문의 : <strong>010-4568-5944</strong></p>
      </section>
    </div>
    <div id="root"></div>

    <script src="./assets/js/vendor.js"></script>
    <script src="./assets/data/app-config.js"></script>
    <script src="./assets/js/shared.js"></script>
    <script src="./assets/js/valuation-methods.js"></script>
    <script src="./assets/data/institution-reference-data.js"></script>
    <script src="./assets/data/ecos-rd-ratios.js"></script>
    <script src="./assets/js/reference-data.js"></script>
    <script src="./assets/js/valuation-engine.js"></script>
    <script src="./assets/js/scoring.js"></script>
    <script src="./assets/js/reporting.js"></script>
    <script src="./assets/vendor/pdfjs/pdf.min.js"></script>
    <script src="./assets/js/cretop-pdf-import.js"></script>
    <script src="./assets/js/workbench.js"></script>
    <script src="./assets/js/ui-fixes.js"></script>

    <script src="../access-control.js"></script>
    <script src="./assets/js/access-gate.js"></script>
  </body>
</html>
